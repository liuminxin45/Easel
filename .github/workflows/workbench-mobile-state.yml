name: Workbench mobile state

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'easel/**'
      - 'easel_workbench/**'
      - 'tools/health-control/**'
      - 'skills/builtin/**'
      - 'skills/shared/workbench/**'
      - 'agents/workspace/**'
      - 'tests/frontend/**'
      - 'tests/test_workbench*.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - 'scripts/audit_easel_base.mjs'
      - 'scripts/audit_workbench_interactions.mjs'
      - 'docs/workbench/upstream-base.json'
      - 'docs/workbench/import-baseline.json'
      - '.gitattributes'
      - 'AGENTS.md'
      - '.github/workflows/workbench-mobile-state.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'easel/**'
      - 'easel_workbench/**'
      - 'tools/health-control/**'
      - 'skills/builtin/**'
      - 'skills/shared/workbench/**'
      - 'agents/workspace/**'
      - 'tests/frontend/**'
      - 'tests/test_workbench*.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - 'scripts/audit_easel_base.mjs'
      - 'scripts/audit_workbench_interactions.mjs'
      - 'docs/workbench/upstream-base.json'
      - 'docs/workbench/import-baseline.json'
      - '.gitattributes'
      - 'AGENTS.md'
      - '.github/workflows/workbench-mobile-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-mobile-state:
    if: github.repository == 'liuminxin45/Easel'
    name: Mobile state (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies without media or model runtimes
        run: python -m pip install --prefer-binary pytest fastapi httpx requests websocket-client cryptography pyyaml python-multipart sse-starlette pillow
      - name: Install locked frontend dependencies
        working-directory: web/frontend
        run: npm ci
      - name: Verify mobile state and all frontend regressions
        working-directory: web/frontend
        run: node --test --test-concurrency=2 ../../tests/frontend/*.test.mjs
      - name: Verify business concurrency, health and state using TEMP data
        run: python -m pytest -q tests/test_workbench_chat_history_windows.py tests/test_workbench_architecture.py tests/test_workbench_skill_policy.py tests/test_workbench_skill_commands.py tests/test_workbench_local_locking.py tests/test_workbench_worker_progress.py tests/test_workbench_delivery_projection.py tests/test_workbench_collection_freshness.py tests/test_workbench_business_health.py tests/test_workbench_health_watchdog.py tests/test_workbench_collector_bootstrap.py tests/test_workbench_plan_preview.py tests/test_workbench_collection_partial_diagnostics.py tests/test_workbench_session_creation.py tests/test_workbench_session_recovery_ports.py tests/test_workbench_usage_diagnostics.py tests/test_workbench_library_index.py tests/test_workbench_content_library_health.py tests/test_workbench_chinese_trend_titles.py
      - name: Verify host types, interactions and official ancestry
        working-directory: web/frontend
        run: npm run check:workbench
      - name: Verify independent health, daily idempotency and production scale performance without real model calls
        run: python -m pytest -q tools/health-control/tests tests/test_workbench_canary_export.py tests/test_workbench_health_bridge.py tests/test_workbench_health_endpoint.py tests/test_workbench_atomic_state.py tests/test_workbench_performance_diagnostics.py tests/test_workbench_creative_preview_readonly.py tests/test_workbench_learning_idle_cost.py
      - name: Build original Easel independently
        working-directory: web/frontend
        run: npm run build
      - name: Build the private host from the same shared components
        working-directory: web/frontend
        run: npm run build:workbench
