name: Workbench skill bytes

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'easel_workbench/**'
      - 'scripts/*workbench*'
      - 'scripts/git-hooks/**'
      - 'docs/workbench/skill-source-bytes.json'
      - 'tests/test_workbench_skill_source_sync.py'
      - 'tests/test_workbench_deployment_controls.py'
      - 'tests/test_workbench_release_source.py'
      - 'tests/test_workbench_skill_bytes.py'
      - 'tests/test_workbench_git_delivery.py'
      - 'tests/test_workbench_chat_business.py'
      - '.gitattributes'
      - '.github/workflows/workbench-skill-bytes.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'easel_workbench/**'
      - 'scripts/*workbench*'
      - 'scripts/git-hooks/**'
      - 'docs/workbench/skill-source-bytes.json'
      - 'tests/test_workbench*.py'
      - '.gitattributes'
      - '.github/workflows/workbench-skill-bytes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-bytes:
    name: Exact skill bytes (${{ matrix.os }}, autocrlf=${{ matrix.autocrlf }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        autocrlf: ['true', 'false']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Exercise a fresh checkout with the selected Git EOL mode
        shell: pwsh
        run: |
          git config core.autocrlf '${{ matrix.autocrlf }}'
          git checkout-index --all --force
          if ($LASTEXITCODE -ne 0) { throw 'Git re-checkout failed' }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated validation dependencies
        run: python -m pip install pytest pyyaml fastapi httpx requests websocket-client cryptography python-multipart sse-starlette
      - name: Verify reviewed raw bytes and Git attributes
        run: python scripts/check_workbench_skill_bytes.py
      - name: Reject local third-party files in the public fork
        run: python scripts/check_workbench_local_skills.py
      - name: Verify local skill selection, metadata and frozen input contracts
        run: python -m pytest -q tests/test_workbench_local_skills.py
      - name: Verify publication, exact bytes and deployment rejection
        run: python -m pytest -q tests/test_workbench_skill_bytes.py tests/test_workbench_skill_source_sync.py tests/test_workbench_deployment_controls.py tests/test_workbench_release_source.py tests/test_workbench_git_delivery.py tests/test_workbench_chat_business.py tests/test_workbench_official_skills.py tests/test_workbench_skill_retirement.py
