<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e1d7;color:#243d34;font-family:'Microsoft YaHei','PingFang SC',sans-serif}
.poster{width:1080px;height:1440px;background:#fffef8;display:flex;flex-direction:column}
.heading{padding:44px 64px 34px;background:#163a31;color:#fffef8;min-height:218px}
.eyebrow{font-size:29px;line-height:1.5;color:#cddbd0;margin:0 0 13px}
h1{font-size:64px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-1px}
.deck{font-size:31px;line-height:1.5;margin:16px 0 0;color:#dde5dd}
.list{padding:8px 64px 0;flex:1}
.item{display:grid;grid-template-columns:46px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid #dce1d7;min-height:205px}
.item:last-child{border:0}.rank{font-size:30px;line-height:1.6;color:#889787;font-variant-numeric:tabular-nums}
h2{font-size:36px;line-height:1.3;margin:0 0 9px;font-weight:700;overflow-wrap:anywhere;word-break:normal}
.summary{font-size:38px;line-height:1.45;margin:0 0 9px;overflow-wrap:anywhere}
.metric{font-size:25px;line-height:1.5;color:#657763;margin:0}
.footer{display:flex;justify-content:space-between;gap:20px;margin:18px 64px 34px;font-size:26px;line-height:1.5;color:#667568}
.watermark{white-space:nowrap}
</style></head><body>{{pages}}</body></html>
