<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e6df;color:#20211e;font-family:'Microsoft YaHei','PingFang SC',sans-serif}
.poster{width:1080px;height:1440px;background:#fbfaf6;padding:44px 64px 32px;display:flex;flex-direction:column;border-top:9px solid #bc493a}
.heading{flex-shrink:0;padding-bottom:24px;border-bottom:2px solid #292b26}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 20px;font-size:26px;line-height:1.35;color:#62635c}
.brand{font-size:28px;color:#272a24;font-weight:600}.date{font-variant-numeric:tabular-nums}
h1{font-size:66px;line-height:1.18;letter-spacing:-1px;margin:0;font-weight:700;text-wrap:balance}
.deck{font-size:32px;line-height:1.3;margin:16px 0 0;color:#a94335;font-weight:600}
.list{flex:1;display:grid;grid-template-rows:repeat(5,minmax(0,1fr));padding-top:9px}
.item{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:23px;align-content:center;border-bottom:1px solid #dedcd3;padding:13px 0}
.item:last-child{border-bottom:0}.rank{font-size:25px;line-height:1.6;color:#af493a;font-variant-numeric:tabular-nums}
h2{font-size:35px;line-height:1.3;margin:0 0 7px;font-weight:700;overflow-wrap:anywhere;text-wrap:pretty}
.summary{font-size:33px;line-height:1.45;margin:0 0 5px;overflow-wrap:anywhere;text-wrap:pretty}
.closing{font-size:31px;line-height:1.45;margin:0 0 9px;color:#69584e;overflow-wrap:anywhere;text-wrap:pretty}
.metric{font-size:23px;line-height:1.4;color:#75766d;margin:0;font-variant-numeric:tabular-nums}
.footer{flex-shrink:0;margin-top:12px;padding-top:12px;border-top:2px solid #292b26;display:flex;justify-content:flex-end;font-size:25px;line-height:1.35;color:#585e52}.watermark{white-space:nowrap}
</style></head><body>{{pages}}</body></html>
